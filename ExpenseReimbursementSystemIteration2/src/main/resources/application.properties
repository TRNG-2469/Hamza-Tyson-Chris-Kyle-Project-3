spring.application.name=ExpenseReimbursementSystemIteration2

# DB Config
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/employee_db}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.username=${DB_USER:postgres}
spring.datasource.password=${DB_PASS:postgres}

# JPA Config
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# JWT (Base64-encoded, >= 32 bytes). Loaded from .env by App.main; a random key is used if missing.
jwt.secret=${JWT_SECRET:}
