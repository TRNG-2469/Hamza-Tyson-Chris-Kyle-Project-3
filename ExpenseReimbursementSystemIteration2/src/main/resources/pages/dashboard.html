<!DOCTYPE html>
<html>
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Expense Reimbursement System</title>
        <link rel="stylesheet" href="styles.css"/>
    </head>

    <body>
        <div class="header">
            <h1>Expense Reimbursement System</h1>
            <button class="logout-btn" id="logoutButton">Log Out</button>
        </div>
        <h2 class="subheader">Welcome, <span id="username">User</span>!</h2>
        <p style="display: none;">Role: <span id="role"></span></p>

        <section class="dash-block">
            <div>
                <h2>My Reimbursements</h2>
            </div>
            <label for="myStatus" id="status-label" style="display: none;">Filter by Status:</label>
            <select id="myStatus" style="display: none;">
                <option value="">All</option>
                <option value="PENDING">Pending</option>
                <option value="APPROVED">Approved</option>
                <option value="DENIED">Denied</option>
            </select>
            <button id="loadMyReimbursements">View My Reimbursements</button>
            <div id="myReimbursements"></div>
            <button id="loadMyReimbursements" class="btn">View My Reimbursements</button>
        </section>

        <section class="dash-block">
            <h2>Submit Reimbursement</h2>
            <form id="reimbursementForm">
                <div>
                    <label for="amount">Amount:</label>
                    <input type="number" id="amount" step="0.01" min="0" required>
                </div>
                <div>
                    <label for="description">Description:</label>
                    <input type="text" id="description" required>
                </div>
                <div>
                    <label for="type">Type:</label>
                    <select id="type" required>
                        <option value="">Select Type</option>
                        <option value="FOOD">Food</option>
                        <option value="LODGING">Lodging</option>
                        <option value="TRAVEL">Travel</option>
                        <option value="OTHER">Other</option>
                    </select>
                </div>
                <button type="submit" class="btn">Submit Reimbursement</button>
            </form>
            <p id="reimbursementMessage"></p>
        </section>

        <section id="managerSection" class="dash-block" style="display: none;">
            <h2>Manager Dashboard</h2>
            <div id="filter-boxes" style="display: none;">
                <div class="manager-filters">
                    <label for="managerStatus" id="managerStatus-label">Filter by Status:</label>
                    <select id="managerStatus">
                        <option value="">All</option>
                        <option value="PENDING">Pending</option>
                        <option value="APPROVED">Approved</option>
                        <option value="DENIED">Denied</option>
                    </select>
                </div>
                <div class="manager-filters">
                    <label for="managerDepartment" id="managerDepartment-label">Filter by Department:</label>
                    <select id="managerDepartment">
                        <option value="">All</option>S
                    </select>
                </div>
            </div>
            <div id="allReimbursements"></div>
            <button id="loadAllReimbursements" class="btn">View All Reimbursements</button>
        </section>

        <script>
            document.addEventListener("DOMContentLoaded", async () => {
                const message = document.getElementById("message");
                try {
                    // update to have Authorization header
                    const response = await authFetch("/user");
                    if (!response.ok) {
                        window.location.href = "/";
                        return;
                    }
                    const user = await response.json();
                    document.getElementById("username").textContent = user.username;
                    document.getElementById("role").textContent = user.role;
                    if (user.role === "MANAGER") {
                        document.getElementById("managerSection").style.display = "block";
                        loadManagerDepartments();
                    }
                } catch (error) {
                    console.error("Failed to load user:", error);
                    message.textContent = "Unable to load user information.";
                }
            });

            function logout() {
                // no server session to invalidate  drop the client's token
                localStorage.removeItem("token");
                window.location.href = "/";
            }

            async function viewReimbursements() {
                const userId = await getUserId();
                if (!userId) {
                    return;
                }
                document.getElementById("myStatus").style.display = "block";
                document.getElementById("status-label").style.display = "block";
                document.getElementById("loadMyReimbursements").textContent = "Refresh";
                const status = document.getElementById("myStatus").value;
                let url = "/reimbursements/" + userId;
                if (status) {
                    url += "?status=" + status;
                }
                try {

                    const response = await authFetch(url);

                    if (!response.ok) {
                        alert("Unable to load reimbursements.");
                        return;
                    }
                    const reimbursements = await response.json();
                    console.log(reimbursements);
                    const results = document.getElementById("myReimbursements");
                    results.innerHTML = "";
                    reimbursements.forEach(reimbursement => {
                        const holder = document.createElement("div");
                        const item = document.createElement("p");
                        item.textContent =
                            "ID: " + reimbursement.reimbursementId +
                            " | Amount: $" + reimbursement.amount +
                            " | Description: " + reimbursement.description +
                            " | Type: " + reimbursement.type +
                            " | Status: " + reimbursement.status;

                        holder.appendChild(item);
                        // only allow editing ui for reimbursement that is pending by default.
                        if (reimbursement.status === "PENDING") {
                            const editButton = document.createElement("button");
                            editButton.textContent = "Edit";
                            editButton.addEventListener("click", () => editReimbursement(reimbursement));
                            holder.appendChild(editButton);
                        }
                        results.appendChild(holder);
                    });
                } catch (error) {
                    console.error("Failed to load reimbursements:", error);
                    alert("Error loading reimbursements.");
                }
            }

            async function viewAllReimbursements() {
                const status = document.getElementById("managerStatus").value;
                const departmentId = document.getElementById("managerDepartment").value;
                let url = "/manager/reimbursements";
                const params = new URLSearchParams();
                if (status) {
                    params.append("status", status);
                }
                if (departmentId) {
                    params.append("departmentId", departmentId);
                }
                if (params.toString()) {
                    url += "?" + params.toString();
                }
                // fetch the manager's reimbursement list, filtered by whatever's selected
                const response = await authFetch(url);
                if (!response.ok) {
                    alert("Unable to load reimbursements.");
                    return;
                }
                document.getElementById("filter-boxes").style.display = "flex";
                document.getElementById("loadAllReimbursements").textContent = "Refresh";
                const reimbursements = await response.json();
                const results = document.getElementById("allReimbursements");
                // wipe out whatever was rendered from the last click, before drawing the new list
                results.innerHTML = "";

                // key = resolverId, value = that manager's username — avoids re-fetching the same manager twice
                const resolverNames = {};

                // "for...of" (not forEach) because we need to actually await each lookup in order
                for (const reimbursement of reimbursements) {
                    // default text for items nobody has resolved yet
                    let resolvedByText = "-";
                    if (reimbursement.resolverId) {
                        // only hit the network if this resolverId hasn't been looked up already this render
                        if (!resolverNames[reimbursement.resolverId]) {
                            const userResponse = await authFetch("/users/" + reimbursement.resolverId);
                            // on success, store the username; otherwise store a fallback so we don't retry forever
                            resolverNames[reimbursement.resolverId] = userResponse.ok
                                ? (await userResponse.json()).username
                                : "Unknown";
                        }
                        resolvedByText = resolverNames[reimbursement.resolverId];
                    }

                    const item = document.createElement("p");
                    item.textContent =
                        "ID: " + reimbursement.reimbursementId +
                        " | Amount: $" + reimbursement.amount +
                        " | Type: " + reimbursement.type +
                        " | Status: " + reimbursement.status +
                        " | Author ID: " + reimbursement.authorId +
                        // display a resolver id of manager who approved or denied the reim
                        " | Resolved by: " + (reimbursement.resolverId || "-");
                    holder.appendChild(item);
                        // now a real username instead of a raw resolverId number
                        " | Resolved by: " + resolvedByText;
                    results.appendChild(item);

                    // only pending items can be approved or denied
                    if (reimbursement.status === "PENDING") {
                        const approveButton = document.createElement("button");
                        approveButton.textContent = "Approve";
                        // click calls resolveReimbursement with this item and the target status
                        approveButton.addEventListener("click", () => resolveReimbursement(reimbursement, "APPROVED"));
                        holder.appendChild(approveButton);

                        const denyButton = document.createElement("button");
                        denyButton.textContent = "Deny";
                        denyButton.addEventListener("click", () => resolveReimbursement(reimbursement, "DENIED"));
                        holder.appendChild(denyButton);
                    }
                    results.appendChild(holder);
                });
                }
            }

            async function loadManagerDepartments() {
                const dropdown = document.getElementById("managerDepartment");
                try {
                    const response = await authFetch("/departments");
                    if (!response.ok) {
                        return;
                    }
                    const departments = await response.json();
                    departments.forEach(dept => {
                        const option = document.createElement("option");
                        option.value = dept.departmentId;
                        option.textContent = dept.departmentName;
                        dropdown.appendChild(option);
                    });
                } catch (error) {
                    console.error("Failed to load departments:", error);
                }
            }

            async function getUserId() {
                const response = await authFetch("/user");
                if (!response.ok) {
                    window.location.href = "/";
                    return null;
                }
                const user = await response.json();
                return user.userId;
            }

            async function authFetch(url, options = {}) {
                // grab whatever token login.html stored
                const token = localStorage.getItem("token");
                // merge in the Authorization header without clobbering any headers the caller passed
                const headers = {...options.headers, Authorization: "Bearer " + token};
                const response = await fetch(url, {...options, headers});
                // missing/expired/invalid token — same handling as a manual logout
                if (response.status === 401) {
                    localStorage.removeItem("token");
                    window.location.href = "/";
                }
                return response;
            }

            document.getElementById("reimbursementForm").addEventListener("submit", async function(event) {
                // stop the browser's default full-page-reload form submission
                event.preventDefault();

                // pull the three values the user typed/selected
                const reimbursement = {
                    amount: Number(document.getElementById("amount").value),
                    description: document.getElementById("description").value,
                    type: document.getElementById("type").value,
                    // need this to satisfied @valid b/c reimbursment need status
                    status: "PENDING"
                };

                // send it to the backend, authFetch attaches the bearer token automatically
                const response = await authFetch("/reimbursements", {
                    method: "POST",
                    headers: {"Content-Type": "application/json"},
                    body: JSON.stringify(reimbursement)
                });

                const messageEl = document.getElementById("reimbursementMessage");
                if (response.ok) {
                    messageEl.textContent = "Reimbursement submitted.";
                    // clear the form so it's empty for the next submission
                    event.target.reset();
                } else {
                    messageEl.textContent = "Failed to submit reimbursement.";
                }
            });

            async function editReimbursement(reimbursement) {
                // users for inputs to update reimburesment
                const amount = prompt("New amount:", reimbursement.amount);
                if (amount === null) return;
                const description = prompt("New description:", reimbursement.description);
                if (description === null) return;
                const type = prompt("New type (FOOD, LODGING, TRAVEL, OTHER):", reimbursement.type);
                if (type === null) return;
                // force intput to be all cap
                const normalizedType = type.trim().toUpperCase();

                // set a new js object to hold updatd values
                const updated = {
                    amount: Number(amount),
                    description: description,
                    type: normalizedType, // make sure input is in correct format
                    // required to pass @Valid on the way in  the backend ignores this value
                    status: reimbursement.status
                };

                // send the patch request to the backend
                const response = await authFetch("/reimbursements/" + reimbursement.reimbursementId, {
                    method: "PATCH",
                    headers: {"Content-Type": "application/json"},
                    body: JSON.stringify(updated)
                });
                // return a backend status on success or not
                if (response.ok) {
                    alert("Reimbursement updated.");

                    viewReimbursements();
                } else {
                    alert("Failed to update reimbursement.");
                }
            }

            async function resolveReimbursement(reimbursement, newStatus) {
                // js object that hold currrent data i need to send to back end
                const updated = {
                    // current reimbsuresment obj
                    amount: reimbursement.amount,
                    description: reimbursement.description,
                    type: reimbursement.type,
                    // status become new value from manager changing it
                    status: newStatus
                };

                // manager endpoint using authFetch to attaches the bearer token to know this is manager
                const response = await authFetch("/manager/reimbursements/" + reimbursement.reimbursementId, {
                    method: "PATCH",
                    headers: {"Content-Type": "application/json"},
                    body: JSON.stringify(updated)
                });

                if (response.ok) {
                    alert("Reimbursement " + newStatus.toLowerCase() + ".");
                    // refresh the list so the resolved item drops out of the pending view
                    viewAllReimbursements();
                } else {
                    alert("Failed to update reimbursement.");
                }
            }







            document.getElementById("loadMyReimbursements").addEventListener("click", viewReimbursements);
            document.getElementById("logoutButton").addEventListener("click", logout);
            document.getElementById("loadAllReimbursements").addEventListener("click", viewAllReimbursements);
        </script>
    </body>
</html>
