<main>
  <h1>Manage Reimbursements</h1>
  <div class="reimbursement-layout">
    <app-manager-reimbursement-list
      class="reimbursement-list"
      (reimbursementSelected)="handleSelectReimbursement($event)">
    </app-manager-reimbursement-list>

    <app-manager-reimbursement-details-panel
      class="reimbursement-details"
      [selectedReimbursement]="selectedReimbursement"
      [currentUsername]="authService.username()">
    </app-manager-reimbursement-details-panel>
  </div>
</main>
