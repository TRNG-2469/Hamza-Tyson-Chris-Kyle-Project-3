<div>
    <h2>Reimbursement Details</h2>
    @if (selectedReimbursement) {
        <p>ID: {{ selectedReimbursement.reimbursementId }}</p>
        <p>Amount: {{ selectedReimbursement.amount }}</p>
        <p>Description: {{ selectedReimbursement.description }}</p>
        <p>Status: {{ selectedReimbursement.status }}</p>

        <button (click) = "startEdit()">Edit</button>
    } @else {
        <p>No reimbursement selected.</p>
    }
</div>
