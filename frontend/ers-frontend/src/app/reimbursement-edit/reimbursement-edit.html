<div>
  <h2>Reimbursement Details</h2>
  <form id="edit-form">
    <div>ID: </div>

    <div id="amount-field">
      <label for="amount">Amount:</label>
      <input type="number" id="amount" name="amount" min="0" max="10000" step="0.01" required>
    </div>

    <div>
      <label for="description">Description:</label>
      <input type="text" id="description" name="description" required>
    </div>

    <div>
      <label for="type">Type:</label>
      <select id="type" name="type">
        <option selected disabled value="">Select Type</option>
        <option value="FOOD">Food</option>
        <option value="LODGING">Lodging</option>
        <option value="TRAVEL">Travel</option>
        <option value="OTHER">Other</option>
      </select>
    </div>

    <div>Status: </div>

    <button type="submit" id="submit" (click)="submitEdits()">Submit</button>
    <button type="button" id="cancel" (click)="cancelEdits()">Cancel</button>
  </form>
</div>
